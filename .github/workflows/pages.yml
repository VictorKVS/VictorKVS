name: Deploy engineering showcase to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - ".nojekyll"
      - "products/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble public site artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html architecture.html journey.html status.html 404.html .nojekyll _site/
          cp -R products _site/products

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
