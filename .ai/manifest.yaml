  inactivity_is_not_authorization_for_destructive_change: true
  latest_classification_batch: docs/CLASSIFICATION_BATCH_19.md
  excluded_classes:
    - protected-active-core
    - active-knowledge-base
    - reserved-future-kb
    - active-project-dependency
    - recent-active-work
  dispositions:
    - SHOWCASE
    - LEARNING
    - ARCHIVE
    - MERGE-CANDIDATE
  destructive_default: false

navigation:
